{% extends "layout.html" %}

{% block content %}

<h2>Add Student</h2>

<form method="POST">

<div class="row">

<div class="col-md-6 mb-3">
<label>First Name</label>
<input type="text"
       name="first_name"
       class="form-control"
       required>
</div>

<div class="col-md-6 mb-3">
<label>Last Name</label>
<input type="text"
       name="last_name"
       class="form-control"
       required>
</div>

<div class="col-md-6 mb-3">
<label>Gender</label>

<select name="gender"
        class="form-control">

<option>Male</option>
<option>Female</option>
<option>Other</option>

</select>

</div>

<div class="col-md-6 mb-3">
<label>Mobile Number</label>

<input type="text"
       name="mobile_number"
       class="form-control">
</div>

<div class="col-md-6 mb-3">
<label>Email</label>

<input type="email"
       name="email"
       class="form-control">
</div>

<div class="col-md-6 mb-3">
<label>Course Name</label>

<input type="text"
       name="course_name"
       class="form-control">
</div>

<div class="col-md-6 mb-3">
<label>Admission Date</label>

<input type="date"
       name="admission_date"
       class="form-control">
</div>

</div>

    <button class="btn btn-success">
    Add Student
    </button>

</form>

{% endblock %}
