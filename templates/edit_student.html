{% extends "layout.html" %}

{% block content %}

<h2>Edit Student</h2>

<form method="POST">

<div class="row">

<div class="col-md-6 mb-3">
<label>First Name</label>

<input type="text"
name="first_name"
class="form-control"
value="{{ student.first_name }}"
required>
</div>

<div class="col-md-6 mb-3">
<label>Last Name</label>

<input type="text"
name="last_name"
class="form-control"
value="{{ student.last_name }}"
required>
</div>

<div class="col-md-6 mb-3">
<label>Gender</label>

<select name="gender"
class="form-control">

<option {% if student.gender=='Male' %}selected{% endif %}>
Male
</option>

<option {% if student.gender=='Female' %}selected{% endif %}>
Female
</option>

<option {% if student.gender=='Other' %}selected{% endif %}>
Other
</option>

</select>

</div>

<div class="col-md-6 mb-3">
<label>Mobile Number</label>

<input type="text"
name="mobile_number"
class="form-control"
value="{{ student.mobile_number }}">
</div>

<div class="col-md-6 mb-3">
<label>Email</label>

<input type="email"
name="email"
class="form-control"
value="{{ student.email }}">
</div>

<div class="col-md-6 mb-3">
<label>Course Name</label>

<input type="text"
name="course_name"
class="form-control"
value="{{ student.course_name }}">
</div>

<div class="col-md-6 mb-3">
<label>Admission Date</label>

<input type="date"
name="admission_date"
class="form-control"
value="{{ student.admission_date }}">
</div>

</div>

<button class="btn btn-success">
Update Student
</button>

</form>

{% endblock %}
