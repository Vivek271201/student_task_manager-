{% extends "layout.html" %}

{% block content %}

<div class="d-flex justify-content-between">

<h2>Assigned Tasks</h2>

<a href="{{ url_for('assign_task') }}"
class="btn btn-primary">
Assign Task
</a>

</div>

<table class="table table-bordered mt-4">

<thead>

<tr>

<th>ID</th>
<th>Student Name</th>
<th>Task Name</th>
<th>Maximum Marks</th>

</tr>

</thead>

<tbody>

{% for row in assignments %}

<tr>

<td>{{ row.assigned_id }}</td>

<td>
{{ row.first_name }}
{{ row.last_name }}
</td>

<td>{{ row.task_name }}</td>

<td>{{ row.maximum_marks }}</td>

</tr>

{% endfor %}

</tbody>

</table>

{% endblock %}
